<!DOCTYPE html>
<html>
<head>
    <title>Unscripted Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background: #f4f4f4;
        }

        input {
            width: 80%;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #answer {
            margin-top: 25px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Unscripted Project</h1>

    <p>Ask a question:</p>

    <input id="question" type="text" placeholder="Type your question here">

    <br>

    <button onclick="getAnswer()">Get Answer</button>

    <div id="answer"></div>

    <script>
        function getAnswer() {
            let question = document.getElementById("question").value.toLowerCase();
            let answer = document.getElementById("answer");

            if (question.includes("hello")) {
                answer.innerHTML = "Hello! Welcome to Unscripted Project.";
            }
            else if (question.includes("name")) {
                answer.innerHTML = "This website is called Unscripted Project.";
            }
            else if (question.includes("what is html")) {
                answer.innerHTML = "HTML is the language used to structure webpages.";
            }
            else if (question.includes("what is javascript")) {
                answer.innerHTML = "JavaScript is a programming language that can make webpages interactive.";
            }
            else {
                answer.innerHTML = "Sorry, I don't know the answer to that question yet.";
            }
        }
    </script>

</body>
</html>
